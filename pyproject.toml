[project]
name = "datapassport"
dynamic = ["version"]
description = "Portable evidence about datasets: content fingerprints, profiles, version diffs, drift and CI-ready contracts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yousof Selim" }]
requires-python = ">=3.11"
keywords = ["data quality", "data engineering", "fingerprint", "data contracts", "drift", "duckdb", "polars", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
polars = ["polars>=1.0", "pyarrow>=15"]
pandas = ["pandas>=2.0", "pyarrow>=15"]
arrow = ["pyarrow>=15"]
pandera = ["pandera>=0.20"]
all = ["polars>=1.0", "pandas>=2.0", "pyarrow>=15"]

[project.scripts]
datapassport = "datapassport.cli:app"
dpp = "datapassport.cli:app"

[project.urls]
Documentation = "https://github.com/yeegz/datapassport/tree/main/docs"
Source = "https://github.com/yeegz/datapassport"
Issues = "https://github.com/yeegz/datapassport/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/datapassport/__about__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pandas-stubs",
    "types-pyyaml",
    "pandera>=0.36.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: large-file tests (run with -m slow)"]
filterwarnings = ["error::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
"src/datapassport/cli.py" = ["UP007", "B904"]
"tests/*" = ["PT018", "PT011", "E731", "B023"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["src/datapassport"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "polars.*", "pyarrow.*", "pandas.*", "yaml", "pandera.*"]
ignore_missing_imports = true
