name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov=datapassport --cov-report=term-missing:skip-covered

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.11 --resolution lowest-direct
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel in a clean environment and smoke-test the CLI
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          printf 'a,b\n1,x\n2,y\n' > /tmp/t.csv
          /tmp/clean/bin/datapassport inspect /tmp/t.csv
          /tmp/clean/bin/datapassport fingerprint /tmp/t.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install polars numpy && python examples/make_data.py
      - uses: ./
        with:
          data: examples/data/orders_v1.parquet
          contract: examples/contract.yml
